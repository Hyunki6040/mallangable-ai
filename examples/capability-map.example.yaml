# Example capability map exposed by a hypothetical 'to-do app' host (spec 2.2, 2.10)
# Schema: schemas/capability-map.schema.json
host:
  id: todo-app
  version: "3.4.0"
map_version: "1.2.0"
extension_points:
  - id: theme.tokens
    kind: token
    d_min: D1
    d_max: D1
    stability: stable
    description: Color, font and spacing design tokens
  - id: task.row.style
    kind: token
    d_min: D1
    d_max: D2
    stability: stable
    description: "Conditional style rules (e.g. highlight overdue tasks)"
  - id: toolbar.command
    kind: command
    d_min: D2
    d_max: D2
    stability: stable
    description: Buttons and shortcuts that combine existing commands
    merge:
      /shortcuts: { strategy: map, keys: [key] }   # if both sides add shortcuts, merge per key (6.6 R2)
  - id: sidebar.panel
    kind: view
    d_min: D3
    d_max: D3
    stability: stable
    description: Declarative panel placed in the sidebar
  - id: task.on_complete
    kind: hook
    d_min: D4
    d_max: D4
    stability: experimental
    description: Event hook that runs when a task is completed
  - id: sync.server_action
    kind: service
    d_min: D4
    d_max: D4
    stability: experimental
    description: Extension point that runs on the server. Logic that must stay private goes here (spec 7.8)
capabilities:
  - { id: tasks.read,     risk: read,      lexicon_id: cap_tasks_read }
  - { id: tasks.write,    risk: write,     lexicon_id: cap_tasks_write }
  - { id: notify.local,   risk: write,     lexicon_id: cap_notify_local }
  - { id: net.slack.post, risk: egress,    lexicon_id: cap_net_post }
  - { id: people.read,    risk: sensitive, lexicon_id: cap_people_read }
catalog_id: "https://todo.example/catalogs/v3"
catalog:
  - { component: list,    a11y: "Text label per item, keyboard navigation" }
  - { component: card,    a11y: "Title required" }
  - { component: chart,   a11y: "Data table alternative text required" }
  - { component: button,  a11y: "Label required, contrast 4.5:1 or higher" }
  - { component: toggle,  a11y: "Also show state as text" }
