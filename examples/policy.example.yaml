# Example policy chain: operator plan → tenant → org (spec 4.2~4.9)
# Schema: schemas/policy.schema.json
# Effective policy = intersection of the three documents. A child cannot be wider than its parent (I5).
policy:
  id: operator/plan-business
  level: operator
  knobs:
    depth:          { ceiling: D4, default: D3 }
    activation:     { ceiling: live, by_depth: { D1: live, D2: live, D3: preview, D4: preview } }
    baseline_apply: { ceiling: auto, default: approve }
    sharing:        { ceiling: tenant, reshare: author_opt_in }
    quality_tier:   { ceiling: high, default: standard }
    platform_export: { ceiling: V1 }
  floors: [rollback, safe_mode, visibility_notice, export_intents, permission_view, spend_cap, receipt]
  notes: Business plan. A pricing plan is also a policy ceiling (spec 9.7)
---
policy:
  id: tenant/acme
  level: tenant
  inherits: operator/plan-business
  knobs:
    depth:            { ceiling: D3, default: D2 }
    capabilities:     { ceiling: [tasks.read, tasks.write, notify.local, net.slack.post] }
    network:          { ceiling: allowlist, allowlist: ["hooks.slack.com"] }
    activation:       { ceiling: preview, approver_on_capability_increase: tenant_admin }
    baseline_apply:   { ceiling: auto, default: approve }
    sharing:          { ceiling: tenant, reshare: author_opt_in }
    code_visibility:  { value: own }
    model_route:      { value: tenant_cloud }
    quality_tier:     { ceiling: standard, default: standard }
    budget:           { monthly: 3000, per_user_monthly: 30, currency: USD, on_exceed: stop }
    admin_visibility: { value: V2 }
    platform_export:  { ceiling: V0 }
    retention_days:   395
  floors: [rollback, safe_mode, visibility_notice, export_intents, permission_view, spend_cap, receipt]
---
policy:
  id: org/acme-design
  level: org
  inherits: tenant/acme
  knobs:
    depth:          { ceiling: D3, default: D2 }
    capabilities:   { ceiling: [tasks.read, tasks.write, notify.local] }   # external transmission capability excluded (stricter)
    sharing:        { ceiling: tenant, reshare: forbidden }
    baseline_apply: { ceiling: approve, default: approve }
  floors: [rollback, safe_mode, visibility_notice, export_intents, permission_view, spend_cap, receipt]
